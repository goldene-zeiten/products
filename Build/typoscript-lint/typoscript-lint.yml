paths:
  - packages/*/*/Configuration
  - packages-dev/*/Configuration
  - packages/*/*/ext_conf_template.txt

filePatterns:
  - "*.tsconfig"
  - "*.typoscript"
  - ext_conf_template.txt
  - ext_typoscript_*.txt

sniffs:
  - class: Indentation
    parameters:
      indentPerLevel: 4
  - class: RepeatingRValue
    disabled: true
