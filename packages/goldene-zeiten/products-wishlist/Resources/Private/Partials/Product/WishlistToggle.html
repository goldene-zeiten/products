<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
>
<f:comment>
    The catalogue views around this partial may come from the page cache, so the visitor's wishlist state is
    not rendered here but by the uncached toggle plugin.
</f:comment>
<f:if condition="{wishlistEnabled}">
    <f:cObject typoscriptObjectPath="lib.productsWishlistToggle" data="{productUid: product.uid}" />
</f:if>
</html>
