    category: mcp
  products.mcp.path:
    type: string
    default: '/mcp'
    label: 'LLL:EXT:products_mcp/Resources/Private/Language/locallang_settings.xlf:setting.products.mcp.path'
    category: mcp
  products.mcp.sessionLifetime:
    type: int
    default: 3600
