<h1><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:order_confirmation" /></h1>
<p><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:hello" /></p>
<p><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:thank_you_for_order" arguments="{0: order.orderNumber}" /></p>
<p><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:order_total" />: {order.totalGross.decimalString} {order.currency}</p>
<f:if condition="{withdrawalFullyExcluded}">
	<f:then>
		<p><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:withdrawal_notice_fully_excluded" /></p>
	</f:then>
	<f:else>
		<f:if condition="{withdrawalPeriodDays}">
			<p>
				<f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:withdrawal_notice_intro" arguments="{0: withdrawalPeriodDays}" /><br>
				<f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:withdrawal_notice_deadline" arguments="{0: withdrawalDeadline}" /></p>
			<f:if condition="{withdrawalUrl}">
				<table role="presentation" cellpadding="0" cellspacing="0" style="margin: 16px 0;">
					<tr>
						<td style="background-color: #b02a37; border-radius: 4px;">
							<a href="{withdrawalUrl}" style="display: inline-block; padding: 12px 24px; color: #ffffff; text-decoration: none; font-weight: bold;"><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:withdrawal_button_label" /></a>
						</td>
					</tr>
				</table>
			</f:if>
			<f:if condition="{withdrawalExcludedItems}">
				<p>
					<f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_email.xlf:withdrawal_notice_excluded_items" /><br>
					<f:for each="{withdrawalExcludedItems}" as="excludedItem">- {excludedItem.title}<br></f:for>
				</p>
			</f:if>
		</f:if>
	</f:else>
</f:if>
<f:render partial="Email/Signature" arguments="{_all}" />
