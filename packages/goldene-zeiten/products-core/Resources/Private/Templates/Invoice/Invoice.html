{namespace p=GoldeneZeiten\Products\Core\ViewHelpers}
<html>
<head>
    <style>
        body { font-family: sans-serif; font-size: 12px; color: #222; }
        h1 { font-size: 20px; }
        table { width: 100%; }
    </style>
</head>
<body>
<f:render partial="Invoice/Seller" arguments="{seller: seller}" />
<h1><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:invoice_title" /></h1>

<table style="margin-bottom: 20px;">
    <tr>
        <td><strong><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:invoice_number" /></strong>: {order.invoiceNumber}</td>
        <td><strong><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:order_number" /></strong>: {order.orderNumber}</td>
        <td><strong><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:order_date" /></strong>: {order.orderDate -> f:format.date(format: 'd.m.Y')}</td>
    </tr>
    <tr>
        <td><strong><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:invoice_date" /></strong>: {order.orderDate -> f:format.date(format: 'd.m.Y')}</td>
        <td colspan="2"><strong><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:date_of_supply" /></strong>: <f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:date_of_supply_invoice_date" /></td>
    </tr>
</table>

<f:render partial="Invoice/AddressBlock" arguments="{order: order}" />
<f:render partial="Invoice/LineItems" arguments="{order: order, moneyLocale: moneyLocale}" />

<f:render partial="Invoice/Totals" arguments="{order: order, moneyLocale: moneyLocale}" />

<p style="margin-top: 30px;"><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:footer_note" /></p>
</body>
</html>
