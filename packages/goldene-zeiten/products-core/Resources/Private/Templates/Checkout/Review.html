{namespace p=GoldeneZeiten\Products\Core\ViewHelpers}
<div class="checkout-review">
    <h2><f:translate key="checkout_review" /></h2>
    <f:flashMessages />

    <div class="row">
        <div class="col-md-6">
            <h4><f:translate key="billing_address" /></h4>
            <f:render partial="Order/Address" arguments="{address: address}" />
            <f:if condition="{deliveryAddress}">
                <f:then>
                    <h4><f:translate key="delivery_address" /></h4>
                    <f:render partial="Order/Address" arguments="{address: deliveryAddress}" />
                </f:then>
            </f:if>
            <f:if condition="{giftMessage}">
                <f:then>
                    <h4><f:translate key="gift_message" /></h4>
                    <p>{giftMessage}</p>
                </f:then>
            </f:if>
            <f:if condition="{customerNote}">
                <h4><f:translate key="customer_note" /></h4>
                <p><f:format.nl2br>{customerNote}</f:format.nl2br></p>
            </f:if>
            <f:if condition="{desiredDeliveryDate}">
                <h4><f:translate key="desired_delivery_date" /></h4>
                <p><f:format.date date="{desiredDeliveryDate}" format="{f:translate(key: 'date_format')}" /></p>
            </f:if>
        </div>
        <div class="col-md-6">
            <h4><f:translate key="payment_method" /></h4>
            <p>{paymentMethod.label}</p>
            <f:if condition="{shippingSelection.option}">
                <f:then>
                    <h4><f:translate key="checkout_shipping_method" /></h4>
                    <p>{shippingSelection.label} - <p:format.money value="{shippingSelection.total}" currency="{basket.currency}" locale="{moneyLocale}" /></p>
                </f:then>
            </f:if>
        </div>
    </div>

    <f:render partial="Basket/Notices" arguments="{basket: basket, settings: settings}" />

    <div class="mt-4">
        <f:render partial="Order/Summary" arguments="{summary: basket, totals: totals}" />
    </div>

    <f:render partial="Checkout/LoyaltyRedeem" arguments="{_all}" />

    <div class="mt-4">
        <f:form action="finalize" requestToken="products/checkout">
            <f:render partial="Checkout/LoyaltySlot" arguments="{_all}" />
            <div class="form-check mb-3">
                <f:form.checkbox name="termsAccepted" value="1" class="form-check-input" id="termsAccepted" required="required" />
                <label class="form-check-label" for="termsAccepted"><f:translate key="terms_accepted_label" /></label>
                <f:render partial="Checkout/LegalLinks" arguments="{settings: settings}" />
            </div>
            <f:if condition="{withdrawalWaiverRequired}">
                <div class="form-check mb-3">
                    <f:form.checkbox name="withdrawalWaiverAccepted" value="1" class="form-check-input" id="withdrawalWaiverAccepted" required="required" />
                    <label class="form-check-label" for="withdrawalWaiverAccepted"><f:translate key="withdrawal_waiver_label" /></label>
                </div>
            </f:if>
            <f:if condition="{withdrawalExemptPersonalizedItems}">
                <p class="text-muted small"><f:translate key="withdrawal_exempt_personalized_notice" /></p>
            </f:if>
            <f:form.submit value="{f:translate(key: 'place_order')}" class="btn btn-success btn-lg" />
        </f:form>
    </div>
</div>
