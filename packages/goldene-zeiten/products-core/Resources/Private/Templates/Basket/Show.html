{namespace p=GoldeneZeiten\Products\Core\ViewHelpers}
<div class="basket">
    <h2><f:translate key="shopping_basket" /></h2>
    <f:flashMessages />
    <f:if condition="{basket.empty}">
        <f:then>
            <p><f:translate key="basket_empty" /></p>
        </f:then>
        <f:else>
            <f:render partial="Basket/Notices" arguments="{basket: basket, settings: settings}" />
            <table class="table">
                <thead>
                    <tr>
                        <th><f:translate key="product" /></th>
                        <th><f:translate key="quantity" /></th>
                        <th><f:translate key="price" /></th>
                        <th><f:translate key="total" /></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <f:for each="{basket.items}" as="item" iteration="itemIteration">
                        <tr>
                            <td>
                                {item.product.title}
                                <f:if condition="{item.article}">
                                    <f:then>
                                        <br><small>{item.article.title}</small>
                                    </f:then>
                                </f:if>
                                <f:render partial="LineItem/Options" arguments="{options: item.lineOptions, currency: basket.currency, moneyLocale: moneyLocale}" />
                            </td>
                            <td>
                                <f:form action="update" controller="Basket" requestToken="products/basket">
                                    <f:form.hidden name="product" value="{item.product.uid}" />
                                    <f:if condition="{item.article}">
                                        <f:then>
                                            <f:form.hidden name="article" value="{item.article.uid}" />
                                        </f:then>
                                    </f:if>
                                    <f:if condition="{item.optionsKey}">
                                        <f:then>
                                            <f:form.hidden name="optionsKey" value="{item.optionsKey}" />
                                        </f:then>
                                    </f:if>
                                    <label for="products-basket-quantity-{itemIteration.index}" class="visually-hidden"><f:translate key="quantity_of" arguments="{0: item.product.title}" /></label>
                                    <f:form.textfield name="quantity" value="{item.quantity}" size="3" id="products-basket-quantity-{itemIteration.index}" />
                                    <f:form.submit value="{f:translate(key: 'update')}" class="btn btn-secondary btn-sm" />
                                </f:form>
                            </td>
                            <td><p:format.money value="{item.unitPriceGross}" currency="{basket.currency}" locale="{moneyLocale}" /></td>
                            <td><p:format.money value="{item.lineTotalGross}" currency="{basket.currency}" locale="{moneyLocale}" /></td>
                            <td>
                                <f:form action="remove" controller="Basket" requestToken="products/basket" class="d-inline">
                                    <f:form.hidden name="product" value="{item.product.uid}" />
                                    <f:if condition="{item.article}">
                                        <f:then>
                                            <f:form.hidden name="article" value="{item.article.uid}" />
                                        </f:then>
                                    </f:if>
                                    <f:if condition="{item.optionsKey}">
                                        <f:then>
                                            <f:form.hidden name="optionsKey" value="{item.optionsKey}" />
                                        </f:then>
                                    </f:if>
                                    <f:form.submit value="{f:translate(key: 'remove')}" class="btn btn-danger btn-sm" />
                                </f:form>
                            </td>
                        </tr>
                    </f:for>
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="3"><f:translate key="total_net" /></th>
                        <td><p:format.money value="{basket.totalNet}" currency="{basket.currency}" locale="{moneyLocale}" /></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th colspan="3"><f:translate key="tax" /></th>
                        <td><p:format.money value="{basket.totalTax}" currency="{basket.currency}" locale="{moneyLocale}" /></td>
                        <td></td>
                    </tr>
                    <tr>
                        <th colspan="3"><f:translate key="total_gross" /></th>
                        <td><strong><p:format.money value="{basket.totalGross}" currency="{basket.currency}" locale="{moneyLocale}" /></strong></td>
                        <td></td>
                    </tr>
                    <f:if condition="{basket.depositTotal.cents} > 0">
                        <f:then>
                            <tr>
                                <th colspan="3"><f:translate key="deposit_total" /></th>
                                <td><p:format.money value="{basket.depositTotal}" currency="{basket.currency}" locale="{moneyLocale}" /></td>
                                <td></td>
                            </tr>
                        </f:then>
                    </f:if>
                </tfoot>
            </table>

            <f:render partial="Discount/VoucherBasket" arguments="{basket: basket}" />

            <div class="actions">
                <f:link.action action="address" controller="Checkout" pageUid="{settings.pids.checkoutPage}" class="btn btn-primary"><f:translate key="proceed_to_checkout" /></f:link.action>
            </div>
        </f:else>
    </f:if>
</div>
