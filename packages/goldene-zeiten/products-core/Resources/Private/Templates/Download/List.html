<div class="products-downloads">
    <f:if condition="{downloads -> f:count()}">
        <f:then>
            <f:if condition="{released}">
                <f:else>
                    <p class="downloads-pending"><f:translate key="download.available_after_payment" /></p>
                </f:else>
            </f:if>
            <f:for each="{downloads}" as="group">
                <div class="downloads-group">
                    <h3 class="downloads-group-title">{group.product.title}</h3>
                    <ul class="downloads-list">
                        <f:for each="{group.files}" as="fileReference">
                            <li class="downloads-item">
                                <f:if condition="{released}">
                                    <f:then>
                                        <f:link.action action="file" arguments="{order: order, file: fileReference.uid, hash: hash}" class="downloads-link">{fileReference.originalResource.name}</f:link.action>
                                    </f:then>
                                    <f:else>{fileReference.originalResource.name}</f:else>
                                </f:if>
                            </li>
                        </f:for>
                    </ul>
                </div>
            </f:for>
        </f:then>
        <f:else>
            <p class="downloads-empty"><f:translate key="download.no_files" /></p>
        </f:else>
    </f:if>
</div>
