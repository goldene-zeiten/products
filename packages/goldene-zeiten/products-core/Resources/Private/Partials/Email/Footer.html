<html data-namespace-typo3-fluid="true" xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers">
<f:if condition="{trader.name}">
    <p>
        {trader.name}<f:for each="{trader.addressLines}" as="line"><br>{line}</f:for>
    </p>
</f:if>
<f:if condition="{vatId}">
    <p><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:seller_vat_id" />: {vatId}</p>
</f:if>
<f:if condition="{taxNumber}">
    <p><f:translate key="LLL:EXT:products_core/Resources/Private/Language/locallang_invoice.xlf:seller_tax_number" />: {taxNumber}</p>
</f:if>
</html>
