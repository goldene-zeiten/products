<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
      xmlns:p="http://typo3.org/ns/GoldeneZeiten/Products/Core/ViewHelpers"
>
<ul>
    <f:for each="{nodes}" as="node">
        <li>
            <f:link.action action="list" controller="Category" pluginName="CategoryList" extensionName="ProductsCore" pageUid="{settings.pids.categoryPage}" arguments="{category: node.category.uid}">{node.category.title}</f:link.action>
            <span class="badge">(<p:category.productCount category="{node.category}" />)</span>
            <f:if condition="{node.children}">
                <f:then>
                    <f:render partial="Category/TreeBranch" arguments="{nodes: node.children, settings: settings}" />
                </f:then>
            </f:if>
        </li>
    </f:for>
</ul>
</html>
