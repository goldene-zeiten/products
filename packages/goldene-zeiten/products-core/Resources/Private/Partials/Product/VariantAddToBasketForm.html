<div class="add-to-basket mt-3">
    <f:form action="add" controller="Basket" extensionName="ProductsCore" pluginName="Basket" pageUid="{settings.pids.basketPage}" requestToken="products/basket">
        <f:form.hidden name="product" value="{product.uid}" />
        <f:form.hidden name="article" value="{article.uid}" />
        <div class="mb-3">
            <label for="products-quantity-{product.uid}-{article.uid}" class="form-label"><f:translate key="quantity" extensionName="ProductsCore" /></label>
            <f:form.textfield name="quantity" value="1" type="number" id="products-quantity-{product.uid}-{article.uid}" class="form-control" additionalAttributes="{min: 1}" />
        </div>
        <f:render partial="Product/LineItemOptions" arguments="{product: product, article: article}" />
        <f:form.submit value="{f:translate(key: 'add_to_basket')}" class="btn btn-primary" />
    </f:form>
</div>
