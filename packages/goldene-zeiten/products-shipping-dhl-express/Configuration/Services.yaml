services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  GoldeneZeiten\Products\Shipping\DhlExpress\:
    resource: '../Classes/*'

  # TYPO3 only exposes cache.* DI services for its own built-in caches, so the extension's rate cache is
  # defined here via a lazy CacheManager::getCache() factory (resolved at runtime, not at compile).
  cache.products_shipping_dhl_express_rates:
    class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
    factory:
      - '@TYPO3\CMS\Core\Cache\CacheManager'
      - 'getCache'
    arguments:
      - 'products_shipping_dhl_express_rates'

  GoldeneZeiten\Products\Shipping\DhlExpress\Rating\HttpDhlExpressRatingClient:
    arguments:
      $rateCache: '@cache.products_shipping_dhl_express_rates'
