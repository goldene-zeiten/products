<html data-namespace-typo3-fluid="true"
      xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
      xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
>
<f:section name="Pagination">
    <nav class="products-pagination solr-pagination" aria-label="{f:translate(key: 'pagination', extensionName: 'ProductsCore')}">
        <ul class="pagination">
            <f:if condition="{pagination.previousPageNumber}">
                <li class="page-item">
                    <a class="page-link solr-ajaxified" rel="prev" href="{s:uri.paginate.resultPage(page: pagination.previousPageNumber)}"><f:translate key="pagination_previous" extensionName="ProductsCore" /></a>
                </li>
            </f:if>
            <f:if condition="{pagination.hasLessPages}">
                <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
            </f:if>
            <f:for each="{pagination.allPageNumbers}" as="page">
                <f:if condition="{page} == {currentPage}">
                    <f:then>
                        <li class="page-item active" aria-current="page"><span class="page-link">{page}</span></li>
                    </f:then>
                    <f:else>
                        <li class="page-item">
                            <f:if condition="{page} > 1">
                                <f:then>
                                    <a class="page-link solr-ajaxified" href="{s:uri.paginate.resultPage(page: page)}">{page}</a>
                                </f:then>
                                <f:else>
                                    <a class="page-link solr-ajaxified" href="{s:uri.paginate.resultPage()}">{page}</a>
                                </f:else>
                            </f:if>
                        </li>
                    </f:else>
                </f:if>
            </f:for>
            <f:if condition="{pagination.hasMorePages}">
                <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
            </f:if>
            <f:if condition="{pagination.nextPageNumber}">
                <li class="page-item">
                    <a class="page-link solr-ajaxified" rel="next" href="{s:uri.paginate.resultPage(page: pagination.nextPageNumber)}"><f:translate key="pagination_next" extensionName="ProductsCore" /></a>
                </li>
            </f:if>
        </ul>
    </nav>
</f:section>
</html>
